<template>
    <lightning-card title="File Upload for Bulk API Processing" icon-name="standard:file">
        <div class="slds-p-around_medium">

            <!-- File Upload -->
            <lightning-file-upload
                label="Upload CSV File"
                name="fileUploader"
                accept=".csv"
                onuploadfinished={handleUploadFinished}
                disabled={isProcessing}>
            </lightning-file-upload>

            <!-- Help text -->
            <div class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                <p>Only CSV files are supported for bulk API processing</p>
            </div>

            <!-- File Info -->
            <template lwc:if={selectedFile}>
                <div class="slds-box slds-theme_shade slds-m-top_medium">
                    <p><strong>File Name:</strong> {selectedFile.title}</p>
                    <p><strong>File ID:</strong> {selectedFile.documentId}</p>
                </div>
            </template>

            <!-- Buttons -->
            <div class="slds-m-top_medium">
                <lightning-button 
                    variant="brand"
                    label="Submit For Processing"
                    onclick={handleSubmitForProcessing}
                    disabled={isSubmitButtonDisabled}>
                </lightning-button>

                <template lwc:if={selectedFile}>
                    <lightning-button 
                        variant="neutral"
                        label="Clear Selection"
                        onclick={handleClearSelection}
                        disabled={isProcessing}
                        class="slds-m-left_small">
                    </lightning-button>
                </template>
            </div>

            <!-- Status Message -->
            <template lwc:if={statusMessage}>
                <div class={statusMessageClass} role="alert">
                    {statusMessage}
                </div>
            </template>

            <!-- Spinner -->
            <template lwc:if={isProcessing}>
                <div class="slds-is-relative slds-m-top_large">
                    <lightning-spinner alternative-text="Processing File..." size="medium"></lightning-spinner>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
