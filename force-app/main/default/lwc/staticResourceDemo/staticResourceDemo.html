<template>
    <lightning-card icon-name="custom:custom14" title="Third Party CSS">
        <div class="slds-var-p-aound_small">
            <p class="slds-text-heading_medium animate__bounceIn animate__delay-5s">{name}</p>
        </div>
    </lightning-card>

    <lightning-card icon-name="custom:custom14" title="Check Permission">
        <div class="slds-var-p-aound_small">
            <template lwc:if={checkPermission}>
                <p>You are authorized to view the message</p>
            </template>
            <template lwc:else>
                <p>You are not authorized to view the message</p>

            </template>
        </div>
    </lightning-card>

    <lightning-card icon-name="custom:custom14" title="Logged in User Name">
        <div class="slds-var-p-aound_small">
            <p>{name}</p>
        </div>
    </lightning-card>

    <lightning-card icon-name="custom:custom14" title="Custom Label Demo">
        <div class="slds-var-p-aound_small">
            <p>{label.platform}</p>
            <p>{label.greeting}</p>
        </div>
    </lightning-card>

    <lightning-card icon-name="custom:custom14" title="Asset Resource Demo">
        <div class="slds-var-p-aound_small">
            <img src={myLogoAsset}/>
        </div>
    </lightning-card>

    <lightning-card icon-name="custom:custom14" title="Static Resource Demo">
        <div class="slds-var-p-aound_small">
            <img src={myLogoImage}/>
        </div>
     
    </lightning-card>
    
</template>
