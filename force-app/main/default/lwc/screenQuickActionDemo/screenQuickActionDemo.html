<template>
    <lightning-quick-action-panel header="My action">
      <lightning-record-edit-form
        object-api-name={objectApiName}
        record-id={recordId}
        onsuccess={successHandler}
      >
      <div>
      <lightning-input-field 
        field-name={fields.accountName}
      ></lightning-input-field>
    <lightning-input-field 
        field-name={fields.accountIndustry}
      ></lightning-input-field>
      </div>
        <lightning-button 
          variant="brand"
          label="Save" 
          type="submit"
          onclick={handleClick} 
        ></lightning-button>

        <lightning-button 
          variant="neutral"
          label="Cancel" 
          onclick={closeModel} 
        ></lightning-button>

        
      </lightning-record-edit-form>
    </lightning-quick-action-panel>
</template>
