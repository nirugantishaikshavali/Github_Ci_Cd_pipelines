name: Salesforce CI/CD Pipeline

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SF_CLIENT_ID: ${{ secrets.CONSUMER_KEY }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      SF_ENCRYPTION_IV: ${{ secrets.ENCRYPTION_IV }}

    steps:

      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install Salesforce CLI
      - name: Install Salesforce CLI
        shell: bash
        run: |
          npm install --global @salesforce/cli

      # Verify CLI
      - name: Verify Salesforce CLI
        shell: bash
        run: |
          sf version

      # Decrypt JWT Key
      - name: Decrypt JWT Key
        shell: bash
        run: |
          openssl enc -nosalt -aes-256-cbc -d \
          -in keys/server.key.enc \
          -base64 \
          -K "$SF_ENCRYPTION_KEY" \
          -iv "$SF_ENCRYPTION_IV" \
          -out keys/server.key

      # Authenticate Salesforce Org
      - name: Authenticate Salesforce Org
        shell: bash
        run: |
          sf org login jwt \
          --client-id "$SF_CLIENT_ID" \
          --jwt-key-file keys/server.key \
          --username "$SF_USERNAME" \
          --instance-url https://login.salesforce.com \
          --alias devorg

      # Display Org List
      - name: Display Org List
        shell: bash
        run: |
          sf org list

      # Deploy Metadata
      - name: Deploy Metadata
        shell: bash
        run: |
          sf project deploy start --source-dir force-app